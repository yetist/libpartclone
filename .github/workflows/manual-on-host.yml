name: Manual workflow on my host
on:
  workflow_dispatch:
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: install packages
      run: |
          sudo sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get build-dep -y partclone
          sudo apt-get install -y build-essential meson ninja-build gettext pkg-config
          sudo apt-get install -y f2fs-tools hfsprogs exfatprogs gddrescue libfuse3-dev fuse3 jfsutils reiser4progs hfsprogs hfsplus reiserfsprogs libxxhash-dev libisal-dev jfsutils libjfs-dev libufs2 ufsutils vmfs-tools libvmfs liburcu-dev btrfs-progs valgrind
    - name: meson setup
      run: meson setup build -Dfs-test=true -Dfeature-test=true -Dextfs=enabled -Dntfs=enabled -Dfat=enabled -Dexfat=enabled -Dhfsp=enabled -Dapfs=enabled -Dbtrfs=enabled -Dminix=enabled -Df2fs=enabled -Dreiser4=enabled -Dxfs=enabled -Dnilfs2=enabled -Dfuse=enabled -Djfs=enabled -Dufs=enabled -Dvmfs=enabled
    - name: meson compile
      run: meson compile -C build
    - name: meson test
      run: meson test -C build --print-errorlogs
  specialFeatureTest:
    runs-on: self-hosted
    needs: build
    steps:
    - name: fuse Test
      if: always()
      run: cd build/tests && sudo "$GITHUB_WORKSPACE"/tests/imgfuse.test && cd ../ && pwd
    - name: offset Test
      if: always()
      run: cd build/tests && sudo "$GITHUB_WORKSPACE"/tests/offset.test && cd ../ && pwd
    - name: direct io Test
      if: always()
      run: cd build/tests && sudo "$GITHUB_WORKSPACE"/tests/direct_io.test && cd ../ && pwd
  BTRFSDataIOTest:
    runs-on: self-hosted
    needs: build
    steps:
    - name: btrfs Data Test
      if: always()
      run: cd build/tests && sudo env SOURCEPART="/dev/vdb1" env TARGETPART="/dev/vdb2" bash -x "$GITHUB_WORKSPACE"/tests/data_clone_restore_test btrfs && cd ../ && pwd
  F2FSDataIOTest:
    runs-on: self-hosted
    needs: build
    steps:
