name: C/C++ CI

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  dynamic_build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install packages
      run: |
          sudo sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep partclone
          sudo apt-get install build-essential meson ninja-build gettext pkg-config
          sudo apt-get install ntfs-3g f2fs-tools hfsprogs exfatprogs gddrescue reiser4progs libxxhash-dev libisal-dev liburcu-dev btrfs-progs
          sudo apt-get install libglib2.0-dev libgtk-4-dev xvfb
    - name: meson setup
      run: meson setup build -Dfs-test=true -Dfeature-test=true -Dgtk4=enabled -Dextfs=enabled -Dntfs=enabled -Dfat=enabled -Dexfat=enabled -Dhfsp=enabled -Dapfs=enabled -Dbtrfs=enabled -Dminix=enabled -Df2fs=enabled -Dreiser4=auto -Dxfs=enabled -Dxxhash=true -Disal=true
    - name: meson compile
      run: meson compile -C build
    - name: meson test
      run: meson test -C build --print-errorlogs
    - name: Verify build
      run: |
        file build/src/partclone.extfs
        ldd build/src/partclone.extfs
        nm build/src/partclone.extfs | grep " T main"
        if file build/src/partclone.extfs | grep -q "statically linked"; then
          echo "Error: Binary is statically linked but expected dynamic."
          exit 1
        fi

  dynamic_build_disable_xxhash:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install packages
      run: |
          sudo sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep partclone
          sudo apt-get install build-essential meson ninja-build gettext pkg-config
          sudo apt-get install ntfs-3g f2fs-tools hfsprogs exfatprogs gddrescue reiser4progs libisal-dev liburcu-dev btrfs-progs
          sudo apt-get install libglib2.0-dev libgtk-4-dev xvfb
    - name: meson setup
      run: meson setup build -Dfs-test=true -Dfeature-test=true -Dgtk4=enabled -Dextfs=enabled -Dntfs=enabled -Dfat=enabled -Dexfat=enabled -Dhfsp=enabled -Dapfs=enabled -Dbtrfs=enabled -Dminix=enabled -Df2fs=enabled -Dreiser4=auto -Dxfs=enabled -Dxxhash=false -Disal=true
    - name: meson compile
      run: meson compile -C build
    - name: meson test
      run: meson test -C build --print-errorlogs
    - name: Verify build
      run: |
        file build/src/partclone.extfs
        ldd build/src/partclone.extfs
        nm build/src/partclone.extfs | grep " T main"
        if file build/src/partclone.extfs | grep -q "statically linked"; then
          echo "Error: Binary is statically linked but expected dynamic."
          exit 1
        fi
